<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Air Dombyra</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="bar">
      <strong>Air Dombyra</strong>
      <span id="source" class="pill">—</span>
      <span id="fps" class="pill">0 fps</span>
      <span id="hand-neck" class="pill hand neck">гриф ✕</span>
      <span id="hand-strum" class="pill hand strum">бой ✕</span>
    </header>

    <main>
      <div class="stage">
        <canvas id="canvas" width="1280" height="720"></canvas>
        <div class="hud">
          <div class="fret"><span>лад</span><b id="fret">0</b></div>
          <div id="mute" class="mute">MUTE</div>
        </div>
        <div id="message" class="message">Нажмите «Камера», чтобы начать</div>
      </div>

      <aside class="panel">
        <section>
          <h2>Источник</h2>
          <button id="btn-camera" class="primary">Камера</button>
          <label class="file">
            Открыть запись…
            <input id="file-replay" type="file" accept="application/json,.json" />
          </label>
        </section>

        <section>
          <h2>Видео</h2>
          <button id="btn-video" disabled>● Записать видео</button>
          <div id="clip" class="clip" hidden>
            <video id="clip-video" controls playsinline></video>
            <button id="clip-save" class="primary">💾 Сохранить видео</button>
            <button id="clip-discard">Удалить</button>
          </div>
        </section>

        <section>
          <h2>Домбыра</h2>
          <button id="btn-place">Двигать домбыру</button>
          <label>Струны
            <select id="strings">
              <option value="both">Обе струны</option>
              <option value="0">Только верхняя (D)</option>
              <option value="1">Только нижняя (G)</option>
            </select>
          </label>
          <label>Звучание
            <select id="sustain">
              <option value="long">Долгое</option>
              <option value="short">Короткое, как домбыра</option>
            </select>
          </label>
          <label class="check"><input id="follow" type="checkbox" /> Гриф за левой рукой</label>
          <label>Наклон <input id="tilt" type="range" min="-10" max="40" step="1" /></label>
          <label>Высота <input id="height" type="range" min="0.25" max="0.8" step="0.01" /></label>
        </section>
      </aside>
    </main>

    <video id="video" playsinline muted hidden></video>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
